<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820">
  <defs>
    <style>
      .bg{fill:#101820}.panel{fill:#17232d;stroke:#405565;stroke-width:2}.title{fill:#f4f7fa;font:700 27px Arial}.sub{fill:#aebdca;font:15px Arial}.label{fill:#ecf2f6;font:700 14px Arial}.small{fill:#b8c7d1;font:12px Arial}.tiny{fill:#d4dce2;font:10px Arial}.zone{fill:#263642;stroke:#91a4b2;stroke-width:2}.core{fill:#344651;stroke:#a9bbc5;stroke-width:1.5}.stall{fill:#304a56;stroke:#b8c9d2;stroke-width:1}.aisle{fill:#59636a;stroke:#d7dfe4;stroke-width:1}.ramp{fill:#3e464c;stroke:#d9e0e4;stroke-width:2}.bike{fill:#253f36;stroke:#83b69a;stroke-width:2}.lift{fill:#4b5360;stroke:#abb9c6;stroke-width:2}.column{fill:#c5ccd1;stroke:#18242b;stroke-width:1}.warn{fill:#f6c76a}.line{stroke:#dce4e9;stroke-width:2;fill:none}.arrow{stroke:#f2cf69;stroke-width:3;fill:none;marker-end:url(#arr)}
    </style>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#f2cf69" stroke-width="1.4"/></marker>
  </defs>
  <rect class="bg" width="1200" height="820"/>
  <text class="title" x="42" y="48">AEON MALL ĐÀ NẴNG THANH KHÊ – ZONE A SCHEMATIC</text>
  <text class="sub" x="42" y="76">Illustrative layout only • 1 unit = 1 m • coordinates and dimensions marked [ASSUMED] are not site measurements</text>
  <rect class="panel" x="28" y="105" width="1144" height="670" rx="14"/>

  <!-- Main car-zone boundary: 52 x 44 m; scale 9 px/m -->
  <rect class="zone" x="400" y="270" width="468" height="396" rx="4"/>
  <text class="label" x="410" y="292">ZONE A CAR AREA – 52 × 44 m</text>
  <text class="small" x="410" y="312">Perimeter circulation lane: 6 m each side</text>

  <!-- 40 x 32 m parking core -->
  <rect class="core" x="454" y="324" width="360" height="288"/>
  <text class="small" x="464" y="342">Parking core 40 × 32 m</text>

  <!-- Four rows and two 6 m aisles; 16 stalls each -->
  <rect class="aisle" x="454" y="369" width="360" height="54"/>
  <rect class="aisle" x="454" y="513" width="360" height="54"/>
  <text class="tiny" x="610" y="400">AISLE 6 m</text>
  <text class="tiny" x="610" y="544">AISLE 6 m</text>
  <g id="stalls" fill="none" stroke="#c8d5dc" stroke-width="1">
    <!-- Row A -->
    <rect class="stall" x="454" y="324" width="360" height="45"/>
    <path d="M476.5 324V369 M499 324V369 M521.5 324V369 M544 324V369 M566.5 324V369 M589 324V369 M611.5 324V369 M634 324V369 M656.5 324V369 M679 324V369 M701.5 324V369 M724 324V369 M746.5 324V369 M769 324V369 M791.5 324V369"/>
    <!-- Row B -->
    <rect class="stall" x="454" y="423" width="360" height="45"/>
    <path d="M476.5 423V468 M499 423V468 M521.5 423V468 M544 423V468 M566.5 423V468 M589 423V468 M611.5 423V468 M634 423V468 M656.5 423V468 M679 423V468 M701.5 423V468 M724 423V468 M746.5 423V468 M769 423V468 M791.5 423V468"/>
    <!-- Row C -->
    <rect class="stall" x="454" y="468" width="360" height="45"/>
    <path d="M476.5 468V513 M499 468V513 M521.5 468V513 M544 468V513 M566.5 468V513 M589 468V513 M611.5 468V513 M634 468V513 M656.5 468V513 M679 468V513 M701.5 468V513 M724 468V513 M746.5 468V513 M769 468V513 M791.5 468V513"/>
    <!-- Row D -->
    <rect class="stall" x="454" y="567" width="360" height="45"/>
    <path d="M476.5 567V612 M499 567V612 M521.5 567V612 M544 567V612 M566.5 567V612 M589 567V612 M611.5 567V612 M634 567V612 M656.5 567V612 M679 567V612 M701.5 567V612 M724 567V612 M746.5 567V612 M769 567V612 M791.5 567V612"/>
  </g>
  <text class="tiny" x="470" y="360">16 CAR STALLS</text>
  <text class="tiny" x="470" y="459">16 CAR STALLS</text>
  <text class="tiny" x="470" y="504">16 CAR STALLS</text>
  <text class="tiny" x="470" y="603">16 CAR STALLS</text>

  <!-- Five complete column spans at 7.5m pitch, two aisle edges each aisle -->
  <g class="column">
    <rect x="521.5" y="365" width="5.4" height="5.4"/><rect x="589" y="365" width="5.4" height="5.4"/><rect x="656.5" y="365" width="5.4" height="5.4"/><rect x="724" y="365" width="5.4" height="5.4"/><rect x="791.5" y="365" width="5.4" height="5.4"/>
    <rect x="521.5" y="420" width="5.4" height="5.4"/><rect x="589" y="420" width="5.4" height="5.4"/><rect x="656.5" y="420" width="5.4" height="5.4"/><rect x="724" y="420" width="5.4" height="5.4"/><rect x="791.5" y="420" width="5.4" height="5.4"/>
    <rect x="521.5" y="510" width="5.4" height="5.4"/><rect x="589" y="510" width="5.4" height="5.4"/><rect x="656.5" y="510" width="5.4" height="5.4"/><rect x="724" y="510" width="5.4" height="5.4"/><rect x="791.5" y="510" width="5.4" height="5.4"/>
    <rect x="521.5" y="564" width="5.4" height="5.4"/><rect x="589" y="564" width="5.4" height="5.4"/><rect x="656.5" y="564" width="5.4" height="5.4"/><rect x="724" y="564" width="5.4" height="5.4"/><rect x="791.5" y="564" width="5.4" height="5.4"/>
  </g>
  <text class="tiny" x="820" y="374">Columns: 7.5 m pitch</text>
  <text class="tiny" x="820" y="388">(last remainder 2.5 m)</text>

  <!-- Ramp west side, 2 lanes -->
  <rect class="ramp" x="137" y="436.5" width="263" height="63" rx="3"/>
  <path d="M137 468H400" stroke="#f2cf69" stroke-width="2" stroke-dasharray="10 8"/>
  <path class="arrow" d="M185 452H350"/>
  <path class="arrow" d="M350 484H185"/>
  <text class="label" x="150" y="424">PAIRED RAMP</text>
  <text class="small" x="150" y="520">2 lanes × 3.5 m</text>
  <text class="tiny" x="150" y="537">B1: ground → -3.5 m</text>
  <text class="tiny" x="150" y="552">B2: B1 -3.5 → B2 -7.0 m</text>
  <text class="tiny" x="150" y="567">length ≈ 29.17 m at 12% (assumed)</text>

  <!-- Motorbike annex north side -->
  <rect class="bike" x="584" y="208" width="95" height="45" rx="3"/>
  <text class="label" x="576" y="193">MOTORBIKE ANNEX – ASSUMED</text>
  <g stroke="#9ac9a9" fill="none" stroke-width="1">
    <path d="M592 208V230 M600 208V230 M608 208V230 M616 208V230 M624 208V230 M632 208V230 M640 208V230 M648 208V230 M656 208V230 M664 208V230 M672 208V230"/>
    <path d="M584 230H679"/>
  </g>
  <text class="tiny" x="587" y="246">2 × 12 = 24 bike bays</text>
  <path d="M632 253V270" stroke="#83b69a" stroke-width="3" stroke-dasharray="4 3"/>
  <text class="tiny" x="686" y="234">Outside car-zone</text>

  <!-- Elevator core east side -->
  <rect class="lift" x="879" y="447" width="50" height="43" rx="2"/>
  <rect x="887" y="453" width="18" height="31" fill="#222f38" stroke="#bdc9d1"/>
  <rect x="908" y="453" width="18" height="31" fill="#222f38" stroke="#bdc9d1"/>
  <rect x="868" y="461" width="11" height="14" fill="#697986" stroke="#bdc9d1"/>
  <text class="label" x="946" y="455">ELEVATOR CORE</text>
  <text class="small" x="946" y="475">2 shafts + lobby</text>
  <text class="tiny" x="946" y="493">Static geometry</text>
  <text class="tiny" x="946" y="508">No lift animation</text>

  <!-- Legend and caveat -->
  <g transform="translate(60 625)">
    <text class="label" x="0" y="0">MODEL SCOPE</text>
    <rect class="stall" x="0" y="18" width="20" height="13"/><text class="small" x="30" y="29">Car stalls (4 rows × 16 = 64)</text>
    <rect class="bike" x="0" y="42" width="20" height="13"/><text class="small" x="30" y="53">Motorbike sample annex (24)</text>
    <rect class="lift" x="0" y="66" width="20" height="13"/><text class="small" x="30" y="77">Elevator core (2 static shafts)</text>
  </g>
  <g transform="translate(60 735)">
    <text class="warn" x="0" y="0" style="font:700 14px Arial">IMPORTANT</text>
    <text class="small" x="90" y="0">B1 and B2 use separate illustrative demo worlds. Do not add their sample spaces and report that as AEON's real capacity.</text>
  </g>
</svg>
